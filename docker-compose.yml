version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn_api
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app/src
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    restart: unless-stopped
    networks:
      - churn_network

  # ── MLflow Tracking Server ────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: churn_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./experiments/mlruns:/mlruns
      - ./artifacts:/artifacts
    command: >
      mlflow server
        --backend-store-uri /mlruns
        --default-artifact-root /artifacts
        --host 0.0.0.0
        --port 5000
    restart: unless-stopped
    networks:
      - churn_network

  # ── React Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: churn_frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - churn_network

networks:
  churn_network:
    driver: bridge
