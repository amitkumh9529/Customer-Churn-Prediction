logging:
  handlers:
    - sink: "logs/app.log"
      format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} - {message}"
      level: "INFO"
      rotation: "10 MB"
      retention: "30 days"
      compression: "zip"
    - sink: "sys.stdout"
      format: "<green>{time:HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan> - <level>{message}</level>"
      level: "INFO"
      colorize: true
